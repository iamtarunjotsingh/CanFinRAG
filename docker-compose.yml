services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0"]
    environment:
      CANFINRAG_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

volumes:
  ollama_models:
