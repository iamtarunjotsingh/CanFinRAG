[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canfinrag"
version = "0.1.0"
description = "A citation-grounded RAG assistant for Canadian financial and regulatory documents."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pymupdf>=1.24",
    "pydantic-settings>=2.6",
    "streamlit>=1.40",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
retrieval = [
    "faiss-cpu>=1.9",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.3",
]
testing = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
